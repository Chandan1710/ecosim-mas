version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=ecosim
      - POSTGRES_PASSWORD=ecosim
      - POSTGRES_DB=ecosim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_USER=ecosim_ts
      - POSTGRES_PASSWORD=ecosim_ts
      - POSTGRES_DB=ecosim_ts
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  timescale_data:
  qdrant_data:
  minio_data:
